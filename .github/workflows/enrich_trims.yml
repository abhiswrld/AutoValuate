name: Enrich Car Trims

on:
  schedule:
    # Runs every 4 hours (Midnight, 4am, 8am, 12pm, 4pm, 8pm UTC)
    - cron: '0 */4 * * *'
  workflow_dispatch:

jobs:
  enrich_trims:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run LLM Enrichment Script
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python etl/enrich_trims.py